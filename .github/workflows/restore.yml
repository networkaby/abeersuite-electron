name: Database Restore

# Triggered on demand by the app (POST /api/settings/restore). Downloads the
# chosen dump from Dropbox and runs pg_restore on a GitHub runner. Fire-and-forget:
# the app does not wait — check this run's status in the Actions tab.
#
# WARNING: this REPLACES the entire database with the selected dump.

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: Full Dropbox path of the dump to restore (e.g. /smx-backup-….dump)
        required: true
      target_db_url:
        description: Mandatory direct Postgres connection URL to restore into (e.g. postgresql://...)
        required: true

concurrency:
  group: db-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # target_db_url is NOT put in env here: a job-level env value is printed in every
    # step's log header, and an input is not masked the way a secret is. The first
    # step reads it straight from the event file, masks it, and only then exports it.
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      FILE_PATH: ${{ github.event.inputs.file_path }}
    steps:
      - name: Hide the target database URL in the logs
        run: |
          set -euo pipefail
          URL=$(jq -r '.inputs.target_db_url // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$URL" ]; then echo "target_db_url input is empty."; exit 1; fi
          # Masks the whole URL and the password on its own, in every later line.
          echo "::add-mask::$URL"
          NOPROTO="${URL#*://}"
          USERINFO="${NOPROTO%@*}"
          case "$USERINFO" in *:*) echo "::add-mask::${USERINFO#*:}" ;; esac
          echo "DIRECT_DATABASE_URL=$URL" >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/run_start" || true   # for duration in the Dropbox log
          # apt accepts the ASCII-armored key directly — avoids `gpg --dearmor`
          # which fails under sudo on the runner (cannot open /dev/tty).
          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/keyrings/pgdg.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Download dump from Dropbox
        run: |
          set -euo pipefail
          ACCESS=$(curl -fsS https://api.dropbox.com/oauth2/token \
            -d grant_type=refresh_token \
            -d refresh_token="$DROPBOX_REFRESH_TOKEN" \
            -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET" | jq -r .access_token)
          if [ -z "$ACCESS" ] || [ "$ACCESS" = "null" ]; then echo "Dropbox token mint failed"; exit 1; fi

          HTTP=$(curl -sS -o restore.dump -w "%{http_code}" -X POST \
            https://content.dropboxapi.com/2/files/download \
            -H "Authorization: Bearer $ACCESS" \
            -H "Dropbox-API-Arg: {\"path\":\"$FILE_PATH\"}")
          echo "download HTTP $HTTP"
          if [ "$HTTP" -ge 400 ]; then cat restore.dump || true; echo; exit 1; fi
          ls -lh restore.dump

      - name: Run pg_restore
        run: |
          set -euo pipefail
          # -j runs the data-load and index/constraint phases over several
          # parallel connections — the big win against the high round-trip
          # latency between the runner and the ap-south-1 database.
          # --schema=public restores only the application data, skipping
          # Supabase's superuser-owned system schemas (which the "postgres" role
          # cannot recreate). Works whether the dump is public-only or full.
          /usr/lib/postgresql/17/bin/pg_restore \
            --clean --if-exists --no-owner --no-privileges \
            --schema=public \
            --jobs=4 \
            --dbname "$DIRECT_DATABASE_URL" \
            restore.dump

      # The dump's schema reflects whatever the database looked like at backup time.
      # If a Prisma schema change shipped after that backup, `--clean` just reverted
      # it — db push re-applies the current repo's schema on top so the app (running
      # current code) doesn't immediately break on a missing table/column. Additive
      # only: no --accept-data-loss, so a genuinely destructive diff fails loudly
      # here instead of silently dropping data.
      - name: Sync schema to current code (additive only)
        env:
          DIRECT_URL: ${{ env.DIRECT_DATABASE_URL }}
          DATABASE_URL: ${{ env.DIRECT_DATABASE_URL }}
        run: pnpm prisma db push

      - name: Append run to Dropbox log
        if: always()
        env:
          STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
        run: |
          # Best-effort history line in Dropbox. Never fail the job over the log
          # (no `set -e`), and always exit 0.
          set -uo pipefail
          ACCESS=$(curl -fsS https://api.dropbox.com/oauth2/token \
            -d grant_type=refresh_token \
            -d refresh_token="$DROPBOX_REFRESH_TOKEN" \
            -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET" | jq -r .access_token) || true
          if [ -z "${ACCESS:-}" ] || [ "$ACCESS" = "null" ]; then echo "log: token mint failed, skipping"; exit 0; fi

          # The history log lives at the Dropbox app-folder root, not next to the
          # dump, so one log covers every backup folder.
          LOG="/restore-log.txt"

          # Which database this was, from the connection URL — the Supabase project
          # ref and nothing else. Host, db name and role are the same on every
          # project here, so they identified nothing. The password is never parsed.
          PROJECT="-"
          RAW="${DIRECT_DATABASE_URL:-}"
          if [ -n "$RAW" ]; then
            NOPROTO="${RAW#*://}"
            case "$NOPROTO" in *@*) USERINFO="${NOPROTO%%@*}" ;; *) USERINFO="" ;; esac
            DB_USER="${USERINFO%%:*}"
            # Supabase pooler users look like "postgres.<project-ref>".
            case "$DB_USER" in *.*) PROJECT="${DB_USER#*.}" ;; esac
          fi

          SIZE="-"; [ -f restore.dump ] && SIZE=$(ls -lh restore.dump | awk '{print $5}')
          DUR="-"; START=$(cat "$RUNNER_TEMP/run_start" 2>/dev/null || echo "")
          [ -n "$START" ] && { S=$(( $(date +%s) - START )); DUR=$(printf '%dm%02ds' $((S/60)) $((S%60))); }
          # +5:30 on the UTC clock — Indian time without needing tzdata.
          LINE="$(date -u -d "@$(( $(date -u +%s) + 19800 ))" '+%Y-%m-%d %H:%M:%S IST')  RESTORE  $(basename "$FILE_PATH")   size=${SIZE}   dur=${DUR}   ${STATUS}   by=${ACTOR}   project=${PROJECT}"

          # Download the current log (start fresh if it doesn't exist yet), append, re-upload.
          HTTP=$(curl -sS -o prev-log.txt -w "%{http_code}" -X POST \
            https://content.dropboxapi.com/2/files/download \
            -H "Authorization: Bearer $ACCESS" \
            -H "Dropbox-API-Arg: {\"path\":\"$LOG\"}" || echo 000)
          [ "$HTTP" = "200" ] || : > prev-log.txt
          printf '%s\n' "$LINE" >> prev-log.txt

          curl -sS -o /dev/null -X POST \
            https://content.dropboxapi.com/2/files/upload \
            -H "Authorization: Bearer $ACCESS" \
            -H "Dropbox-API-Arg: {\"path\":\"$LOG\",\"mode\":\"overwrite\",\"mute\":true}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @prev-log.txt || true
          echo "log: appended -> $LINE"
          exit 0

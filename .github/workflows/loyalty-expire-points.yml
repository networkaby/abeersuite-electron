name: Expire Loyalty Points

# Daily sweep that expires loyalty lots past their 12-month (configurable) window.
# Vercel serverless can't run cron with App Router handlers, so — like the DB
# backup — a GitHub Actions schedule POSTs a token-guarded API route.
#
# Required secrets:
#   APP_BASE_URL          e.g. https://experimentservice.networkservice.in
#   LOYALTY_CRON_SECRET   must match the deployment's LOYALTY_CRON_SECRET env var

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch: {} # allow manual runs for testing

concurrency:
  group: loyalty-expire
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      LOYALTY_CRON_SECRET: ${{ secrets.LOYALTY_CRON_SECRET }}
    steps:
      - name: POST /api/loyalty/expire-points
        run: |
          set -euo pipefail
          if [ -z "${APP_BASE_URL:-}" ] || [ -z "${LOYALTY_CRON_SECRET:-}" ]; then
            echo "APP_BASE_URL / LOYALTY_CRON_SECRET secret missing"; exit 1
          fi
          HTTP=$(curl -sS -o resp.txt -w "%{http_code}" -X POST \
            "$APP_BASE_URL/api/loyalty/expire-points" \
            -H "Authorization: Bearer $LOYALTY_CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "expire HTTP $HTTP"; cat resp.txt || true; echo
          test "$HTTP" -lt 400

name: Scheduled Database Backup

# The clock for automatic backups. It holds no backup logic — it decides whether this
# hour is a backup hour, and if so calls backup.yml to do the work.
#
# Why the cron is a dumb hourly tick: a cron can only be changed by committing and
# pushing. Asking the app instead lets the shop pick days and times in
# Settings → Backup & Restore and have them take effect on the next tick.
#
# Why this is a separate file from backup.yml: the settings page can switch automatic
# backups off, and it does that through GitHub's enable/disable API, which acts on a
# WHOLE workflow. If the schedule lived in backup.yml, turning it off would also
# disable the "Back up now" button, which dispatches that same file.

on:
  schedule:
    # Hourly tick. Gated below — most of these do nothing and finish in seconds.
    - cron: "0 * * * *"

    # The safety net, and the reason it exists: everything above depends on the app
    # answering. If Vercel is down, the database URL is wrong, or the config row is
    # broken, the gate fails closed and backups stop silently. This one run ignores
    # the gate entirely, so the worst case is one backup a week rather than none.
    - cron: "30 16 * * 0"   # 22:00 IST Sunday

  workflow_dispatch:

jobs:
  # Split from the backup itself so a skipped hour costs seconds, not a runner spin-up
  # with Postgres client installed.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -uo pipefail

          # The weekly safety net, and a hand-started run, both bypass the app.
          if [ "$SCHEDULE" = "30 16 * * 0" ]; then
            echo "weekly safety-net run — backing up regardless of the schedule"
            echo "due=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${SCHEDULE:-}" ]; then
            echo "started by hand — backing up regardless of the schedule"
            echo "due=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ -z "${APP_BASE_URL:-}" ]; then
            echo "APP_BASE_URL secret is not set — cannot ask the app, skipping."
            echo "due=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # CRON_SECRET is optional on both sides. Unset here, the header is omitted
          # rather than sent empty — an app with no secret accepts it either way, and
          # one WITH a secret gives a clean 401 instead of an empty-bearer mismatch.
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH=(-H "Authorization: Bearer $CRON_SECRET")
          else
            AUTH=()
          fi

          # Reminders, emails, scheduled campaigns and due posts are all rung by one
          # cron-job.org job on /api/cron/communications — this tick is backup only.

          BODY=$(curl -sS --max-time 30 "${AUTH[@]}" "${APP_BASE_URL%/}/api/cron/backup-due" || echo '')

          # Fail CLOSED. Failing open would turn an app outage into 24 full dumps a
          # day, which is worse than the missed backups — and the Sunday run above is
          # what stops "closed" meaning "never".
          case "$BODY" in
            *'"due":true'*)
              echo "due this hour: $BODY"
              # Let the app dispatch backup.yml itself: it adds the nightly copy into
              # the standby and keeps its bookkeeping. The app not answering → run
              # backup.yml here with no inputs; it finds the primary from the
              # DIRECT_DATABASE_URL_1 / _2 secrets and makes no copy.
              RUN=$(curl -sS --max-time 60 "${AUTH[@]}" "${APP_BASE_URL%/}/api/cron/backup" || echo '')
              case "$RUN" in
                *'"ok":true'*) echo "app dispatched the backup: $RUN"; echo "due=false" >> "$GITHUB_OUTPUT" ;;
                *)             echo "app did not dispatch (got: ${RUN:-nothing}) — backing up from the secrets"
                               echo "due=true" >> "$GITHUB_OUTPUT" ;;
              esac ;;
            *'"due":false'*) echo "not due: $BODY";       echo "due=false" >> "$GITHUB_OUTPUT" ;;
            *)               echo "app did not answer (got: ${BODY:-nothing}) — skipping this hour";
                             echo "due=false" >> "$GITHUB_OUTPUT" ;;
          esac

  backup:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    # No inputs: backup.yml reads which of DB1 / DB2 is primary from the databases
    # (DIRECT_DATABASE_URL_1 / _2 secrets), dumps it, and names the file "…-git-…".
    uses: ./.github/workflows/backup.yml
    secrets: inherit

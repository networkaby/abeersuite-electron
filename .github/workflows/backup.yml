name: Database Backup

# Runs pg_dump on a GitHub runner — which has the Postgres client tools that
# Vercel functions lack — and uploads the dump to Dropbox. Fire-and-forget: the
# caller does not wait; the file appears in Dropbox a few minutes later.
#
# Three ways in, and the file name records which:
#   manual  the app, on a click     (POST /api/settings/backup)
#   cron    the app, on a schedule  (Vercel Cron -> /api/cron/backup)
#   git     backup-scheduled.yml, with no app involved
#
# The schedule lives in backup-scheduled.yml, not here, so that switching automatic
# backups off from the settings page does not also disable the manual button.

on:
  # Called by backup-scheduled.yml, which owns the timetable. No inputs arrive that
  # way, so the steps below find the primary themselves and build their own file name.
  workflow_call:

  workflow_dispatch:
    inputs:
      file_name:
        description: Dump file name to create in Dropbox. Blank = generate one here.
        required: false
      source_db:
        description: Which database is primary, DB1 or DB2 - a label, never an address. Blank = read it from the databases.
        required: false
      source:
        description: What started this — manual, cron or git. Only used when generating a name.
        required: false
        default: git
      domain:
        description: Site that asked for it, e.g. office.networkservice.in. Name only.
        required: false
      standby_db:
        description: Nightly copy - restore this dump into the standby, DB1 or DB2, after the upload. Blank = no copy.
        required: false

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    # Dump + upload, plus the nightly restore into staging when the app asks for it.
    timeout-minutes: 35
    env:
      # Database addresses live ONLY in GitHub secrets (owner, 2026-11-17): the app
      # sends a label, DB1 or DB2, never an address. Secrets are masked in every log.
      DB_URL_1: ${{ secrets.DIRECT_DATABASE_URL_1 }}
      DB_URL_2: ${{ secrets.DIRECT_DATABASE_URL_2 }}
      SOURCE_DB: ${{ github.event.inputs.source_db }}
      STANDBY_DB: ${{ github.event.inputs.standby_db }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      DROPBOX_FOLDER: ${{ secrets.DROPBOX_FOLDER }}
      FILE_NAME: ${{ github.event.inputs.file_name }}
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/run_start" || true   # for duration in the Dropbox log
          # apt accepts the ASCII-armored key directly — avoids `gpg --dearmor`
          # which fails under sudo on the runner (cannot open /dev/tty).
          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/keyrings/pgdg.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # Which database is primary, from the databases themselves: the `_db_switch` row,
      # latest switched_at wins, no row = DB1 (src/shared/lib/db/dbPrimary.ts). The app's
      # label is only cross-checked against it, so a wrong or stale label can never make
      # this run dump the standby or overwrite the primary.
      - name: Pick the primary and the standby
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          if [ -z "${DB_URL_1:-}" ]; then echo "DIRECT_DATABASE_URL_1 secret is not set."; exit 1; fi
          # Prisma-only URL options (?pgbouncer=true, connection_limit, pool_timeout,
          # schema) make psql / pg_dump / pg_restore refuse the address outright -
          # 2026-11-18 a DB2 secret copied from Vercel stopped the copy that way. Drop
          # them here so every later step gets a plain libpq address.
          libpq() {
            local u="$1" base q out="" p
            case "$u" in *\?*) base="${u%%\?*}"; q="${u#*\?}" ;; *) printf '%s' "$u"; return ;; esac
            IFS='&' read -ra parts <<< "$q"
            for p in "${parts[@]}"; do
              case "${p%%=*}" in pgbouncer|connection_limit|pool_timeout|schema|statement_cache_size|"") ;; *) out="${out:+$out&}$p" ;; esac
            done
            printf '%s' "$base${out:+?$out}"
          }
          for N in 1 2; do
            VAR="DB_URL_$N"; [ -n "${!VAR:-}" ] || continue
            CLEAN=$(libpq "${!VAR}"); echo "::add-mask::$CLEAN"; printf -v "$VAR" '%s' "$CLEAN"
            case "$CLEAN" in *:6543/*) echo "WARNING: DIRECT_DATABASE_URL_$N is the pooled address (6543) - set the direct one (5432)." ;; esac
          done
          BEST=""; BEST_AT=-1; ANSWERED=0
          for N in 1 2; do
            VAR="DB_URL_$N"; URL="${!VAR:-}"
            [ -n "$URL" ] || continue
            if ROW=$("$PSQL" "$URL" -Atq -c 'SELECT primary_db || chr(32) || floor(extract(epoch FROM switched_at))::bigint FROM "_db_switch" WHERE only_row' 2>/dev/null); then
              ANSWERED=1
            elif "$PSQL" "$URL" -Atq -c "SELECT 1" >/dev/null 2>&1; then
              ANSWERED=1; ROW=""   # answered, never switched (no table yet)
            else
              echo "DB$N did not answer"; ROW=""
            fi
            if [ -n "$ROW" ]; then
              ID="${ROW%% *}"; AT="${ROW##* }"
              if [ "$AT" -gt "$BEST_AT" ]; then BEST="$ID"; BEST_AT="$AT"; fi
            fi
          done
          if [ "$ANSWERED" = 0 ]; then echo "Neither database answered."; exit 1; fi
          PRIMARY="${BEST:-DB1}"
          if [ -n "${SOURCE_DB:-}" ] && [ "$SOURCE_DB" != "$PRIMARY" ]; then
            echo "The app says $SOURCE_DB is primary, but the databases say $PRIMARY. Stopping - nothing dumped or copied."
            exit 1
          fi
          N="${PRIMARY#DB}"; VAR="DB_URL_$N"
          if [ -z "${!VAR:-}" ]; then echo "DIRECT_DATABASE_URL_$N secret is not set."; exit 1; fi
          echo "DIRECT_DATABASE_URL=${!VAR}" >> "$GITHUB_ENV"
          echo "primary: $PRIMARY"
          if [ -n "${STANDBY_DB:-}" ]; then
            if [ "$STANDBY_DB" = "$PRIMARY" ]; then echo "Refusing to copy into $STANDBY_DB: it is the primary."; exit 1; fi
            M="${STANDBY_DB#DB}"; VAR="DB_URL_$M"
            if [ -z "${!VAR:-}" ]; then echo "DIRECT_DATABASE_URL_$M secret is not set - no copy."; exit 1; fi
            echo "STANDBY_DB_URL=${!VAR}" >> "$GITHUB_ENV"
            echo "DO_COPY=true" >> "$GITHUB_ENV"
            echo "standby: $STANDBY_DB (copy after upload)"
          fi

      - name: Resolve dump file name
        env:
          SOURCE: ${{ github.event.inputs.source }}
          DOMAIN: ${{ github.event.inputs.domain }}
        run: |
          set -euo pipefail
          if [ -n "${FILE_NAME:-}" ]; then echo "using supplied name: $FILE_NAME"; exit 0; fi

          # No name supplied (a GitHub-timed or hand-started run), so build one here
          # from the primary's secret, which is where the project ref is.
          RAW="${DIRECT_DATABASE_URL:-}"
          if [ -z "$RAW" ]; then echo "No primary database address - check the DIRECT_DATABASE_URL_1 / _2 secrets."; exit 1; fi
          NOPROTO="${RAW#*://}"
          case "$NOPROTO" in *@*) USERINFO="${NOPROTO%%@*}" ;; *) USERINFO="" ;; esac
          DB_USER="${USERINFO%%:*}"
          # Supabase pooler users look like "postgres.<project-ref>".
          case "$DB_USER" in *.*) REF="${DB_USER#*.}" ;; *) REF="" ;; esac

          # Same shape as istStamp()/makeBackupFileName() in
          # src/shared/lib/backup/dropbox.ts — segments dropped when unknown, and
          # only [a-z0-9.-] kept, so the two generators cannot drift apart.
          # Mirrors segment() in dropbox.ts exactly, INCLUDING the 40-character cap —
          # without it a long domain would name the same backup differently depending
          # on which side generated it.
          clean() {
            printf '%s' "$1" | tr 'A-Z' 'a-z' | tr -cs 'a-z0-9.-' '-'               | sed 's/^[-.]*//; s/[-.]*$//' | cut -c1-40
          }
          SRC=$(clean "${SOURCE:-git}"); [ -n "$SRC" ] || SRC="git"
          DOM=$(clean "${DOMAIN:-}")
          # The ref goes through clean() too. Supabase refs are lowercase in practice,
          # but the app-side generator lowercases every segment and these two names
          # must be indistinguishable.
          REF=$(clean "$REF")

          # Indian time without depending on the runner having tzdata: shift the
          # epoch by +5:30 and read it back on the UTC clock.
          IST_NOW=$(date -u -d "@$(( $(date -u +%s) + 19800 ))" '+%Y-%m-%d-%H%M%S')

          NAME="smx-backup"
          [ -n "$DOM" ] && NAME="$NAME-$DOM"
          [ -n "$REF" ] && NAME="$NAME-$REF"
          NAME="$NAME-$SRC-$IST_NOW-IST.dump"
          echo "FILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "generated name: $NAME"

      - name: Run pg_dump
        run: |
          set -euo pipefail
          # --schema=public dumps only the application data. Supabase's own
          # schemas (auth, storage, extensions, graphql, ...) are owned by a
          # superuser and cannot be restored as the "postgres" role — including
          # them produces hundreds of harmless-but-fatal errors on restore.
          /usr/lib/postgresql/17/bin/pg_dump \
            --format=custom --no-owner --no-privileges \
            --schema=public \
            --dbname "$DIRECT_DATABASE_URL" \
            -f backup.dump
          ls -lh backup.dump

      - name: Upload dump to Dropbox
        run: |
          set -euo pipefail
          # Mint a short-lived access token from the long-lived refresh token.
          ACCESS=$(curl -fsS https://api.dropbox.com/oauth2/token \
            -d grant_type=refresh_token \
            -d refresh_token="$DROPBOX_REFRESH_TOKEN" \
            -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET" | jq -r .access_token)
          if [ -z "$ACCESS" ] || [ "$ACCESS" = "null" ]; then echo "Dropbox token mint failed"; exit 1; fi

          # Normalise folder: "" → app-folder root; otherwise ensure a leading "/".
          FOLDER="${DROPBOX_FOLDER:-}"
          if [ -n "$FOLDER" ] && [ "${FOLDER#/}" = "$FOLDER" ]; then FOLDER="/$FOLDER"; fi
          DEST="$FOLDER/$FILE_NAME"

          HTTP=$(curl -sS -o resp.txt -w "%{http_code}" -X POST \
            https://content.dropboxapi.com/2/files/upload \
            -H "Authorization: Bearer $ACCESS" \
            -H "Dropbox-API-Arg: {\"path\":\"$DEST\",\"mode\":\"overwrite\",\"mute\":true}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @backup.dump)
          echo "upload HTTP $HTTP"; cat resp.txt || true; echo
          test "$HTTP" -lt 400

      # ── Nightly copy into the standby (DB1 / DB2) ──────────────────────────────
      # The standby is kept READ-ONLY at the database level so nothing on a stale pointer
      # can write to it (src/shared/lib/db/dbSwitch.server.ts). Opened for the restore,
      # closed again whatever happens. No `prisma db push` here, unlike restore.yml:
      # this dump is tonight's primary, so its schema is already the current one.
      - name: Copy the dump into the standby
        id: copy
        if: env.DO_COPY == 'true'
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          ro() {
            "$PSQL" "$STANDBY_DB_URL" -v ON_ERROR_STOP=1 -q -c \
              "BEGIN READ WRITE; DO \$\$ BEGIN EXECUTE format('ALTER DATABASE %I SET default_transaction_read_only = $1', current_database()); END \$\$; COMMIT;"
          }
          ro off
          trap 'ro on || echo "WARNING: could not set the standby back to read-only"' EXIT
          /usr/lib/postgresql/17/bin/pg_restore \
            --clean --if-exists --no-owner --no-privileges \
            --schema=public \
            --jobs=4 \
            --dbname "$STANDBY_DB_URL" \
            backup.dump
          echo "restored into $STANDBY_DB"

      - name: Report the copy to the app
        if: always() && github.event.inputs.standby_db
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INTO: ${{ github.event.inputs.standby_db }}
          OK: ${{ steps.copy.outcome == 'success' }}
        run: |
          set -uo pipefail
          if [ -z "${APP_BASE_URL:-}" ]; then echo "APP_BASE_URL secret is not set — the switch window will stay shut."; exit 0; fi
          AUTH=(); [ -n "${CRON_SECRET:-}" ] && AUTH=(-H "Authorization: Bearer $CRON_SECRET")
          curl -sS --max-time 30 -X POST "${AUTH[@]}" -H "Content-Type: application/json" \
            -d "{\"into\":\"$INTO\",\"ok\":$OK}" "${APP_BASE_URL%/}/api/cron/db-copied" || true
          echo
          exit 0

      - name: Append run to Dropbox log
        if: always()
        env:
          STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
        run: |
          # Best-effort history line in Dropbox. Never fail the job over the log
          # (no `set -e`), and always exit 0.
          set -uo pipefail
          ACCESS=$(curl -fsS https://api.dropbox.com/oauth2/token \
            -d grant_type=refresh_token \
            -d refresh_token="$DROPBOX_REFRESH_TOKEN" \
            -u "$DROPBOX_APP_KEY:$DROPBOX_APP_SECRET" | jq -r .access_token) || true
          if [ -z "${ACCESS:-}" ] || [ "$ACCESS" = "null" ]; then echo "log: token mint failed, skipping"; exit 0; fi

          # The history log lives at the Dropbox app-folder root, not inside
          # DROPBOX_FOLDER, so one log covers every backup folder.
          LOG="/backup-log.txt"

          # Which database this was, from the connection URL — the Supabase project
          # ref and nothing else. Host, db name and role are the same on every
          # project here, so they identified nothing. The password is never parsed.
          PROJECT="-"
          RAW="${DIRECT_DATABASE_URL:-}"
          if [ -n "$RAW" ]; then
            NOPROTO="${RAW#*://}"
            case "$NOPROTO" in *@*) USERINFO="${NOPROTO%%@*}" ;; *) USERINFO="" ;; esac
            DB_USER="${USERINFO%%:*}"
            # Supabase pooler users look like "postgres.<project-ref>".
            case "$DB_USER" in *.*) PROJECT="${DB_USER#*.}" ;; esac
          fi

          SIZE="-"; [ -f backup.dump ] && SIZE=$(ls -lh backup.dump | awk '{print $5}')
          DUR="-"; START=$(cat "$RUNNER_TEMP/run_start" 2>/dev/null || echo "")
          [ -n "$START" ] && { S=$(( $(date +%s) - START )); DUR=$(printf '%dm%02ds' $((S/60)) $((S%60))); }
          LINE="$(date -u -d "@$(( $(date -u +%s) + 19800 ))" '+%Y-%m-%d %H:%M:%S IST')  BACKUP   ${FILE_NAME}   size=${SIZE}   dur=${DUR}   ${STATUS}   by=${ACTOR}   project=${PROJECT}"

          # Download the current log (start fresh if it doesn't exist yet), append, re-upload.
          HTTP=$(curl -sS -o prev-log.txt -w "%{http_code}" -X POST \
            https://content.dropboxapi.com/2/files/download \
            -H "Authorization: Bearer $ACCESS" \
            -H "Dropbox-API-Arg: {\"path\":\"$LOG\"}" || echo 000)
          [ "$HTTP" = "200" ] || : > prev-log.txt
          printf '%s\n' "$LINE" >> prev-log.txt

          curl -sS -o /dev/null -X POST \
            https://content.dropboxapi.com/2/files/upload \
            -H "Authorization: Bearer $ACCESS" \
            -H "Dropbox-API-Arg: {\"path\":\"$LOG\",\"mode\":\"overwrite\",\"mute\":true}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @prev-log.txt || true
          echo "log: appended -> $LINE"
          exit 0

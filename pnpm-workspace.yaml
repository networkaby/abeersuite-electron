packages:
  - "."

# Every entry here must be an explicit true/false. pnpm writes a
# "set this to true or false" placeholder for any dependency with a build script that
# has no decision recorded — and that placeholder is not a valid value, so `pnpm install`
# then exits 1 and takes the whole build with it. Leaving one in place fails the build.
allowBuilds:
  # Downloads the sentry-cli binary, used for source-map upload. Already listed in
  # onlyBuiltDependencies below, so `true` records the intent that was already there.
  # (Counter builds skip the upload entirely — see COUNTER_BUILD in next.config.ts.)
  '@prisma/engines': set this to true or false
  '@sentry/cli': true
  # Deliberately false: use the shipped N-API prebuild, never a source build.
  # The hardware bridge runs under ELECTRON_RUN_AS_NODE, so its native modules must
  # satisfy Electron 43 (ABI 148) — but a source build here would target the Node that
  # runs the build (ABI 137) and produce a binary the bridge cannot load. The prebuild is
  # N-API and works on both, verified under ELECTRON_RUN_AS_NODE.
  '@serialport/bindings-cpp': false
  electron-winstaller: false
  esbuild: true
  prisma: set this to true or false

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "electron"
  - "electron-winstaller"
  - "@sentry/cli"
  - "esbuild"

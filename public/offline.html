<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You are offline · Network Service</title>
<style>
  :root { color-scheme: light dark; --bg: #eff4fb; --fg: #101725; --muted: #5b6577; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101725; --fg: #eff4fb; --muted: #a3adbf; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 88px; height: 88px; }
  p { color: var(--muted); margin: 4px 0 20px; }
  button { font: inherit; padding: 10px 22px; border-radius: 10px; border: 0; background: #1b6b3a; color: #fff; }
</style>
</head>
<body>
  <main>
    <img src="/shop-icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>Check your internet connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
